name: mongo-sharding-repl

services:
  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet config_server --port 27017 --bind_ip_all
    volumes:
      - configSrv_data_container:/data/db

  shard1-1:
    container_name: shard1-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes:
      - shard1_1_data_container:/data/db

  shard1-2:
    container_name: shard1-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes:
      - shard1_2_data_container:/data/db

  shard1-3:
    container_name: shard1-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27018 --bind_ip_all
    volumes:
      - shard1_3_data_container:/data/db

  shard2-1:
    container_name: shard2-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27019 --bind_ip_all
    volumes:
      - shard2_1_data_container:/data/db

  shard2-2:
    container_name: shard2-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27019 --bind_ip_all
    volumes:
      - shard2_2_data_container:/data/db

  shard2-3:
    container_name: shard2-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27019 --bind_ip_all
    volumes:
      - shard2_3_data_container:/data/db

  mongos:
    container_name: mongos
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb config_server/configSrv:27017 --port 27017 --bind_ip_all
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3
    ports:
      - 27017:27017

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  configSrv_data_container:
  shard1_1_data_container:
  shard1_2_data_container:
  shard1_3_data_container:
  shard2_1_data_container:
  shard2_2_data_container:
  shard2_3_data_container:
