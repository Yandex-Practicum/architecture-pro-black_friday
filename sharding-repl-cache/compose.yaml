services:

  pymongo_api:
    build:
      context: ./api_app
      dockerfile: Dockerfile
    depends_on:
      mongos_router:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

  configsrv:
    image: mongo:7.0.5
    restart: always
    ports:
      - "27017:27017"
    networks:
      - app-network
    volumes:
      - config-data:/data/configdb
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ] 
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval 'db.adminCommand({ping: 1})'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard1-1:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard1-1-data:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard1-2:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard1-2-data:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard1-3:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard1-3-data:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]

  shard2-1:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard2-1-data:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  shard2-2:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard2-2-data:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  shard2-3:
    image: mongo:7.0.5
    restart: always
    networks:
      - app-network
    volumes:
      - shard2-3-data:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mongos_router:
    image: mongo:7.0.5
    restart: always
    ports:
      - "27020:27020"
    networks:
      - app-network
    command:
      [
        "mongos",
        "--configdb", 
        "config_server/configsrv:27017",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    depends_on:
      configsrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27020 --quiet --eval 'db.adminCommand({ping: 1})'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  app-network:
    driver: bridge


volumes:
  config-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
