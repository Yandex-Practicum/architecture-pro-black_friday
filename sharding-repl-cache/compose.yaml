name: sharding-repl-cache
services:
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    restart: always
    ports:
      - "27017:27017"
    networks:
      - mongo-net
    volumes:
      - config_data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017",
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # SHARD 1

  shard1-node1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-node1
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard1-node1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard1-node2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-node2
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard1-node2-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard1-node3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-node3
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard1-node3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # SHARD 2

  shard2-node1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-node1
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard2-node1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard2-node2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-node2
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard2-node2-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard2-node3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-node3
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard2-node3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # SHARD 3

  shard3-node1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard3-node1
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard3-node1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard3", "--bind_ip_all", "--port", "27020"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard3-node2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard3-node2
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard3-node2-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard3", "--bind_ip_all", "--port", "27020"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard3-node3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard3-node3
    restart: always
    networks:
      - mongo-net
    volumes:
      - shard3-node3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard3", "--bind_ip_all", "--port", "27020"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  mongos_router:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27021:27021"
    networks:
      - mongo-net
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017",
        "--bind_ip_all",
        "--port",
        "27021",
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27021", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  redis_1:
    image: "redis:latest"
    container_name: redis_1
    ports:
      - "6379"
    volumes:
      - redis_1_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis_2:
    image: "redis:latest"
    container_name: redis_2
    ports:
      - "6379"
    volumes:
      - redis_2_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis_3:
    image: "redis:latest"
    container_name: redis_3
    ports:
      - "6379"
    volumes:
      - redis_3_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis_4:
    image: "redis:latest"
    container_name: redis_4
    ports:
      - "6379"
    volumes:
      - redis_4_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis_5:
    image: "redis:latest"
    container_name: redis_5
    ports:
      - "6379"
    volumes:
      - redis_5_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis_6:
    image: "redis:latest"
    container_name: redis_6
    ports:
      - "6379"
    volumes:
      - redis_6_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mongo-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    networks:
      - mongo-net
    environment:
      MONGODB_URL: "mongodb://mongos_router:27021"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis_1:6379"

volumes:
  config_data:
  shard1-node1-data:
  shard1-node2-data:
  shard1-node3-data:
  shard2-node1-data:
  shard2-node2-data:
  shard2-node3-data:
  shard3-node1-data:
  shard3-node2-data:
  shard3-node3-data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  redis_4_data:
  redis_5_data:
  redis_6_data:

networks:
  mongo-net:
    driver: bridge
